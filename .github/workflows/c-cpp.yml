name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential cmake pkg-config qt6-base-dev libsdl3-dev

      - name: Build and compile-check all targets
        run: make clean check

      - name: Verify build outputs
        run: test -x build/deepred
